<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TatNat mark">
  <!--
    TatNat small-size-safe mark (favicon / 16-32px use). Light theme.
    Clock rim + scissor-blade "hands" meeting at a pivot = appointment (clock)
    + barbering (scissors) in one glyph. No tick marks or appointment dot at
    this size — see icon.svg for the full-detail version used at 180/512px.
    Tokens: bg #FCFAF8 (token:bg), rim/pivot #29231E (token:primary), hands #E18F14 (token:accent).
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#FCFAF8"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#29231E" stroke-width="5"/>
  <g stroke="#E18F14" stroke-width="7" stroke-linecap="round">
    <line x1="32" y1="32" x2="16.4" y2="23"/>
    <line x1="32" y1="32" x2="47.6" y2="23"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#29231E"/>
</svg>
