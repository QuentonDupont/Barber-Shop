<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TatNat mark (dark)">
  <!--
    TatNat small-size-safe mark, dark variant. Same glyph as icon-mark.svg;
    rim/pivot invert to the warm canvas colour for contrast on a dark
    background, hands stay brand-accent brass in both themes.
    Tokens: bg #1C1612 (new, token:icon-bg-dark), rim/pivot #FCFAF8 (token:bg, reused), hands #E18F14 (token:accent).
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1C1612"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FCFAF8" stroke-width="5"/>
  <g stroke="#E18F14" stroke-width="7" stroke-linecap="round">
    <line x1="32" y1="32" x2="16.4" y2="23"/>
    <line x1="32" y1="32" x2="47.6" y2="23"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#FCFAF8"/>
</svg>
