# Supabase CLI configuration for running Bookly locally.
#
#   npm run local        # starts the stack, writes .env.local, runs next dev
#
# Everything here is the local stack only. Production settings live in the
# Supabase dashboard.

project_id = "bookly"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
# Applied on `supabase db reset` (and the first `supabase start`). Creates two
# demo logins and two published businesses — see seed.sql for the credentials.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Every email the app sends locally is caught here instead of delivered:
# http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so a new account can sign in the moment it is created. Turn on
# in production so a stranger cannot claim an address they do not own.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

# Google sign-in. Leave disabled unless you have OAuth credentials; the
# email/password flow works without it. Set the two variables in
# supabase/.env (never commit it) before enabling.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[analytics]
enabled = false
